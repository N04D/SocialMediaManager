name: Owned Publication Operations

on:
  workflow_dispatch:
    inputs:
      execute_staging_provider_smoke:
        description: "Run optional synthetic staging provider smoke"
        required: false
        default: "false"
  pull_request:
  push:
    branches:
      - main

jobs:
  owned-publication-browser-worker-certification:
    name: Owned Publication Browser and Worker Certification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run fail-on-skip browser and worker certification
        run: |
          python scripts/owned-publication-certify.py --json --output owned-publication-certification.json
      - name: Upload safe certification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owned-publication-certification-report
          path: owned-publication-certification.json
          if-no-files-found: error

  owned-publication-release-gate:
    name: Owned Publication Release Gate
    runs-on: ubuntu-24.04
    needs: owned-publication-browser-worker-certification
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run operations release gate
        run: |
          python -m unittest tests.test_owned_publication_disaster_recovery_phase24 -v
          python -m unittest tests.test_owned_publication_readiness_phase24 -v
          python -m src.plugin_sdk.cli owned-publication release-check --json > owned-publication-readiness.json
      - name: Upload safe readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owned-publication-readiness-report
          path: owned-publication-readiness.json
          if-no-files-found: error

  website-analytics-provider-certification:
    name: Website Analytics Provider Certification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run fixture-only provider certification
        run: |
          python -m unittest tests.test_website_analytics_framework_phase25 -v
          python -m unittest tests.test_plausible_analytics_provider_phase25 -v
          python -m unittest tests.test_website_analytics_sync_phase25 -v
          python -m unittest tests.test_website_analytics_attribution_phase25 -v
          python -m unittest tests.test_website_analytics_funnel_phase25 -v
          python -m unittest tests.test_website_analytics_security_phase25 -v
          python -m src.plugin_sdk.cli website-analytics providers > website-analytics-provider-report.json
      - name: Upload safe website analytics report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-analytics-provider-report
          path: website-analytics-provider-report.json
          if-no-files-found: error

  website-analytics-instrumentation-certification:
    name: Website Analytics Instrumentation Certification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run fixture-only instrumentation certification
        run: |
          python -m unittest tests.test_website_instrumentation_framework_phase26 -v
          python -m unittest tests.test_website_instrumentation_runtime_phase26 -v
          python -m unittest tests.test_website_instrumentation_browser_phase26 -v
          python -m unittest tests.test_website_instrumentation_templates_phase26 -v
          python -m unittest tests.test_website_instrumentation_verification_phase26 -v
          python -m unittest tests.test_website_instrumentation_integration_phase26 -v
          python -m unittest tests.test_website_instrumentation_security_phase26 -v
          python -m src.plugin_sdk.cli website-instrumentation profiles > website-instrumentation-report.json
      - name: Upload safe instrumentation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-instrumentation-report
          path: website-instrumentation-report.json
          if-no-files-found: error

  staging-analytics-deterministic-certification:
    name: Staging Analytics Deterministic Certification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run deterministic staging certification
        run: |
          python -m unittest tests.test_staging_analytics_framework_phase27 -v
          python -m unittest tests.test_staging_analytics_browser_phase27 -v
          python -m unittest tests.test_staging_analytics_reconciliation_phase27 -v
          python -m unittest tests.test_staging_analytics_uncertainty_phase27 -v
          python -m unittest tests.test_staging_analytics_support_bundle_phase27 -v
          python -m unittest tests.test_staging_analytics_security_phase27 -v
          python -m src.plugin_sdk.cli website-analytics staging-profiles > staging-analytics-deterministic-report.json
      - name: Upload safe deterministic staging report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-analytics-deterministic-report
          path: staging-analytics-deterministic-report.json
          if-no-files-found: error

  certification-evidence-integrity:
    name: Certification Evidence Integrity
    runs-on: ubuntu-24.04
    needs: staging-analytics-deterministic-certification
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run certification evidence integrity checks
        run: |
          python -m unittest tests.test_certification_evidence_framework_phase28 -v
          python -m unittest tests.test_certification_evidence_signing_phase28 -v
          python -m unittest tests.test_certification_evidence_import_phase28 -v
          python -m unittest tests.test_certification_evidence_trust_phase28 -v
          python -m unittest tests.test_certification_evidence_freshness_phase28 -v
          python -m unittest tests.test_certification_evidence_operator_phase28 -v
          python -m unittest tests.test_certification_evidence_security_phase28 -v
          python -m src.plugin_sdk.cli certification generate-deterministic > certification-evidence-integrity.json
      - name: Upload safe certification evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certification-evidence-integrity-report
          path: certification-evidence-integrity.json
          if-no-files-found: error

  trusted-signer-ci-artifact-import:
    name: Trusted Signer and CI Artifact Import
    runs-on: ubuntu-24.04
    needs: certification-evidence-integrity
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run trusted signer and fixture CI import checks
        run: |
          python -m unittest tests.test_trusted_signer_framework_phase29 -v
          python -m unittest tests.test_trusted_signer_lifecycle_phase29 -v
          python -m unittest tests.test_ci_artifact_source_phase29 -v
          python -m unittest tests.test_github_actions_artifact_import_phase29 -v
          python -m unittest tests.test_ci_import_attestation_phase29 -v
          python -m unittest tests.test_ci_artifact_security_phase29 -v
          python -m unittest tests.test_ci_artifact_operations_phase29 -v
          python -m src.plugin_sdk.cli certification signers > trusted-signer-ci-artifact-import.json
      - name: Upload safe trusted signer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trusted-signer-ci-artifact-import-report
          path: trusted-signer-ci-artifact-import.json
          if-no-files-found: error

  managed-secrets-operator-trust-controls:
    name: Managed Secrets and Operator Trust Controls
    runs-on: ubuntu-24.04
    needs: trusted-signer-ci-artifact-import
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run managed secret checks
        run: |
          python -m unittest tests.test_managed_secrets_framework_phase30 -v
          python -m unittest tests.test_local_encrypted_secret_backend_phase30 -v
          python -m unittest tests.test_managed_secret_approvals_phase30 -v
          python -m unittest tests.test_managed_secret_signer_integration_phase30 -v
          python -m unittest tests.test_managed_secret_github_integration_phase30 -v
          python -m unittest tests.test_managed_secret_recovery_phase30 -v
          python -m unittest tests.test_managed_secret_security_phase30 -v
          python -m src.plugin_sdk.cli secrets list > managed-secrets-operator-trust-controls.json
      - name: Upload safe managed secrets report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: managed-secrets-operator-trust-controls-report
          path: managed-secrets-operator-trust-controls.json
          if-no-files-found: error

  github-ci-evidence-operator-flow:
    name: GitHub CI Evidence Operator Flow
    runs-on: ubuntu-24.04
    needs: managed-secrets-operator-trust-controls
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run GitHub CI operator flow checks
        run: |
          python -m unittest tests.test_ci_operator_flow_phase31 -v
          python -m unittest tests.test_ci_operator_browser_phase31 -v
          python -m unittest tests.test_ci_operator_review_phase31 -v
          python -m unittest tests.test_ci_operator_recovery_phase31 -v
          python -m unittest tests.test_ci_operator_readiness_phase31 -v
          python -m unittest tests.test_ci_operator_security_phase31 -v
          python -m src.plugin_sdk.cli certification github status > github-ci-evidence-operator-flow.json
      - name: Upload safe GitHub CI operator report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-ci-evidence-operator-flow-report
          path: github-ci-evidence-operator-flow.json
          if-no-files-found: error

  alpha-onboarding-first-publication:
    name: Alpha Onboarding and First Publication
    runs-on: ubuntu-24.04
    needs: github-ci-evidence-operator-flow
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run alpha onboarding deterministic checks
        run: |
          python -m unittest tests.test_alpha_onboarding_framework_phase32 -v
          python -m unittest tests.test_alpha_onboarding_browser_phase32 -v
          python -m unittest tests.test_alpha_onboarding_publication_phase32 -v
          python -m unittest tests.test_alpha_onboarding_recovery_phase32 -v
          python -m unittest tests.test_alpha_onboarding_readiness_phase32 -v
          python -m unittest tests.test_alpha_onboarding_security_phase32 -v
          python -m src.plugin_sdk.cli onboarding status > alpha-onboarding-first-publication.json
      - name: Upload safe alpha onboarding report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-onboarding-first-publication-report
          path: alpha-onboarding-first-publication.json
          if-no-files-found: error

  mvp-dashboard-and-dogfood-flow:
    name: MVP Dashboard and Dogfood Flow
    runs-on: ubuntu-24.04
    needs: alpha-onboarding-first-publication
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run MVP dashboard and dogfood checks
        run: |
          python -m unittest tests.test_mvp_dashboard_phase33 -v
          python -m unittest tests.test_mvp_onboarding_ui_phase33 -v
          python -m unittest tests.test_mvp_composer_ui_phase33 -v
          python -m unittest tests.test_mvp_publication_ui_phase33 -v
          python -m unittest tests.test_mvp_funnel_ui_phase33 -v
          python -m unittest tests.test_mvp_accessibility_phase33 -v
          python -m unittest tests.test_mvp_responsive_phase33 -v
          python -m unittest tests.test_mvp_screenshots_phase33 -v
          python -m unittest tests.test_mvp_browser_e2e_phase33 -v
          python -m unittest tests.test_mvp_ui_security_phase33 -v
          python -m py_compile dashboard.py mvp_dashboard.py tests/phase33_support.py
          python - <<'PY'
          from pathlib import Path
          forbidden = ("Bearer", "private key", "raw token", "content/drafts", "drafts/")
          for path in [Path("mvp_dashboard.py"), *Path("tests").glob("*phase33.py")]:
              text = path.read_text(encoding="utf-8")
              for item in forbidden:
                  if item in text and path.name != "phase33_support.py":
                      raise SystemExit(f"unsafe fixture text {item} in {path}")
          PY
          echo '{"status":"passed","fixtures":"synthetic","external_publication":false}' > mvp-dashboard-and-dogfood-flow.json
      - name: Upload safe MVP dashboard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp-dashboard-and-dogfood-flow-report
          path: mvp-dashboard-and-dogfood-flow.json
          if-no-files-found: error

  staging-analytics-provider-smoke:
    name: Staging Analytics Provider Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' && inputs.execute_staging_provider_smoke == 'true'
    concurrency: staging-analytics-provider-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Report optional staging status
        run: |
          echo '{"status":"not_configured","staging_provider_certification_not_run":true,"reason":"host-owned staging secret references are required"}' > staging-provider-smoke.json
      - name: Upload safe optional staging smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-provider-smoke-report
          path: staging-provider-smoke.json
          if-no-files-found: error
