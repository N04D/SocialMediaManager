services:
  browser-node:
    build:
      context: https://github.com/LvcidPsyche/auto-browser.git#v1.4.0:browser-node
    environment:
      PLAYWRIGHT_SERVER_PORT: 9223
      PLAYWRIGHT_SERVER_ADVERTISED_HOST: browser-node
      BROWSER_WS_ENDPOINT_FILE: /data/browser-profile/browser-ws-endpoint.txt
    ports:
      - "127.0.0.1:${NOVNC_PORT:-6080}:6080"
      - "127.0.0.1:${VNC_PORT:-5900}:5900"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/browser-profile:/data/browser-profile

  controller:
    build:
      context: https://github.com/LvcidPsyche/auto-browser.git#v1.4.0:controller
    depends_on:
      browser-node:
        condition: service_started
    environment:
      API_BEARER_TOKEN: ${API_BEARER_TOKEN:?set API_BEARER_TOKEN}
      REQUIRE_OPERATOR_ID: "true"
      OPERATOR_ID_HEADER: X-Operator-Id
      AUTH_ROOT: /data/auth
      AUTH_STATE_ENCRYPTION_KEY: ${AUTH_STATE_ENCRYPTION_KEY:?set AUTH_STATE_ENCRYPTION_KEY}
      REQUIRE_AUTH_STATE_ENCRYPTION: "true"
      ALLOWED_HOSTS: localhost,127.0.0.1,::1,host.docker.internal
      CONTROLLER_ALLOWED_HOSTS: localhost,127.0.0.1,::1,host.docker.internal
      BROWSER_WS_ENDPOINT_FILE: /data/browser-profile/browser-ws-endpoint.txt
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/controller:/data
      - ./data/browser-profile:/data/browser-profile
      - ./data/uploads-incoming:/shared/uploads/incoming
